<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dapur Teteh">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Dapur Teteh</title>
  <link rel="icon" type="image/svg+xml" href="https://www.google.com/images/about/sheets-icon.svg">

  <style>
    /* ==========================================================================
       ZETTBOS THEME - CLEAN 100% FULL VIEWPORT IFRAME WRAPPER (DAPUR TETEH)
       ========================================================================== */
    :root {
      --bg-deep: #0b0f19;
      --bg-surface: #151b26;
      --bg-glass: rgba(21, 27, 38, 0.85);
      --neon-green: #00ffaa;
      --neon-green-dim: rgba(0, 255, 170, 0.16);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-glass: rgba(255, 255, 255, 0.1);
      --danger: rgba(255, 77, 109, 0.95);
      --online: rgba(0, 200, 130, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      position: fixed;
      inset: 0;
    }

    /* Container Utama Iframe Full Layar Tanpa Scrollbar Ganda */
    .iframe-viewport {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-deep);
      z-index: 1;
    }

    #gasAppFrame {
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
      background-color: transparent;
    }

    /* Preloader Overlay Zettbos Theme */
    .preloader-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-deep) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
      padding: 24px;
      text-align: center;
    }

    .preloader-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 255, 170, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner-ring {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px solid rgba(0, 255, 170, 0.15);
      border-top-color: var(--neon-green);
      animation: spinRing 0.85s linear infinite;
      box-shadow: 0 0 18px var(--neon-green-dim);
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-main);
    }

    .loader-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Indikator Toast Koneksi Otomatis (Hanya Muncul Saat Koneksi Terputus/Pulih) */
    .network-toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-150%);
      background: var(--danger);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .network-toast.is-visible {
      transform: translateX(-50%) translateY(0);
    }

    .network-toast.is-online {
      background: var(--online);
    }
  </style>
</head>
<body>

  <!-- Indikator Toast Koneksi Otomatis (Hanya tampil sementara jika internet putus) -->
  <div id="networkToast" class="network-toast">
    <span id="networkToastText">Koneksi internet terputus...</span>
  </div>

  <!-- Layar Loading (Preloader) Zettbos Theme -->
  <div id="preloaderOverlay" class="preloader-overlay">
    <div class="loader-card">
      <div class="spinner-ring"></div>
      <div>
        <div class="loader-title">Memuat Dapur Teteh...</div>
        <div class="loader-sub">Menyiapkan halaman aplikasi secara penuh.</div>
      </div>
    </div>
  </div>

  <!-- Container Iframe Utama 100% Bersih & Full-Screen -->
  <main class="iframe-viewport">
    <iframe
      id="gasAppFrame"
      src="https://script.google.com/macros/s/AKfycbyLEDMa60INdSe8_DeloMazKbTO3lRqIzfVz0EBnZW_wNt5wjbmTGvpEkozV2Keg6y0KA/exec"
      title="Dapur Teteh"
      allow="clipboard-read; clipboard-write; geolocation; microphone; camera; fullscreen"
      allowfullscreen>
    </iframe>
  </main>

  <script>
    /**
     * ========================================================================
     * SCRIPT PEMBUNGKUS IFRAME BERSIH - DAPUR TETEH
     * Otomatis menyembunyikan preloader dan memantau status jaringan
     * ========================================================================
     */
    var preloaderClosed = false;
    var onlineToastTimer = null;

    window.addEventListener('DOMContentLoaded', function() {
      initIframePreloader();
      initNetworkDetector();
      notifyBackendAccess();
    });

    /**
     * Memantau event onload pada iframe utama & fallback timeout 4 detik
     */
    function initIframePreloader() {
      var iframeEl = document.getElementById('gasAppFrame');
      if (iframeEl) {
        iframeEl.addEventListener('load', function() {
          hidePreloaderScreen();
        });
      }

      // Fallback otomatis 4 detik agar preloader dijamin tertutup mulus
      setTimeout(function() {
        hidePreloaderScreen();
      }, 4000);
    }

    /**
     * Menyembunyikan layar preloader dengan efek fade out lalu display none
     */
    function hidePreloaderScreen() {
      if (preloaderClosed) return;
      preloaderClosed = true;

      var preloader = document.getElementById('preloaderOverlay');
      if (preloader) {
        preloader.classList.add('is-hidden');
        setTimeout(function() {
          preloader.style.display = 'none';
        }, 420);
      }
    }

    /**
     * Memantau status jaringan Online / Offline secara otomatis
     */
    function initNetworkDetector() {
      var toastEl = document.getElementById('networkToast');
      var textEl = document.getElementById('networkToastText');
      if (!toastEl || !textEl) return;

      window.addEventListener('offline', function() {
        if (onlineToastTimer) clearTimeout(onlineToastTimer);
        toastEl.classList.remove('is-online');
        textEl.textContent = 'Koneksi internet terputus. Memeriksa jaringan...';
        toastEl.classList.add('is-visible');
      });

      window.addEventListener('online', function() {
        toastEl.classList.add('is-online');
        textEl.textContent = 'Koneksi internet kembali terhubung!';
        toastEl.classList.add('is-visible');

        if (onlineToastTimer) clearTimeout(onlineToastTimer);
        onlineToastTimer = setTimeout(function() {
          toastEl.classList.remove('is-visible');
        }, 2500);
      });
    }

    /**
     * Opsional: Mencatat log akses jika dibuka langsung dari lingkungan Google Apps Script
     * Aman dari ReferenceError saat di-preview di Canvas maupun di-host di Vercel
     */
    function notifyBackendAccess() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        var uaString = String(navigator.userAgent || 'Web Client').slice(0, 120);
        google.script.run
          .withSuccessHandler(function() {})
          .withFailureHandler(function() {})
          .recordAccessLog({
            userAgent: uaString,
            statusLoad: 'SUCCESS',
            catatan: 'Membuka aplikasi Dapur Teteh'
          });
      }
    }
  </script>
</body>
</html>
